<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#102d59">
<title>모아 관리자</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d59'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--blue:#124eaa;--blue-d:#0d3a82;--navy:#102d59;--ink:#17263b;--muted:#56677d;--bg:#f5f7fb;--line:#dce4ee;--card:#fff;--soft:#e7f0ff;--warn:#b4400a;--ok:#0b6b3a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #508be5;outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* login */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 4px;font-size:22px;letter-spacing:-.5px}.login p{margin:0 0 18px;color:var(--muted);font-size:14px}
.login label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.login input{width:100%;height:48px;border:1px solid #cdd8e7;border-radius:8px;padding:0 12px;background:#fff}
.btn{height:44px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:0 18px}
.btn:hover{background:var(--blue-d)}.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cdd8e7}.btn.ghost:hover{background:#f2f6fc}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #e3b5b1}
.login .btn{width:100%;margin-top:20px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:22px;margin:12px 0 0}
/* shell */
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top b{font-size:18px;letter-spacing:-.4px}.top .sp{flex:1}
.top .who{font-size:13px;color:#cfdcf2;overflow-wrap:anywhere}
.top .btn.ghost{background:#ffffff1c;border-color:#ffffff40;color:#fff}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:0}
nav button{flex:none;border:0;background:none;min-height:46px;padding:0 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue)}
nav .badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;line-height:20px;text-align:center}
main{padding:20px 0 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}.bar select{height:40px;border:1px solid #cdd8e7;border-radius:8px;padding:0 10px;background:#fff}
.muted{color:var(--muted);font-size:13px}
h2{margin:0;font-size:19px;letter-spacing:-.4px}h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}.kpi .s{font-size:12px;color:#7a889c;margin-top:4px}
.kpi.alert .v{color:var(--warn)}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hb .k{overflow-wrap:anywhere}.hb .bar2{height:12px;background:#eaf0f8;border-radius:6px;overflow:hidden}
.hb .bar2 i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hb b{font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#6c7b90}.chart .b1{fill:#9fbdea}.chart .b2{fill:var(--blue)}.chart line{stroke:#e3eaf3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.funnel .row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.funnel .bar2{height:18px;background:#eaf0f8;border-radius:5px;overflow:hidden}.funnel .bar2 i{display:block;height:100%;background:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f8;color:#2a3f5e;white-space:nowrap}
.pill.soon{background:#fde8e1;color:var(--warn)}.pill.new{background:#fff1d6;color:#8a5a00}.pill.done{background:#e3f4ea;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid #cdd8e7;background:#fff;border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.fb{display:flex;flex-direction:column;gap:8px}
.fb .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.fb .msg{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.fb .rel{font-size:13px;color:#174d94;background:var(--soft);border-radius:6px;padding:4px 9px;align-self:flex-start;overflow-wrap:anywhere}
.fb .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fbs{display:grid;gap:12px}
.note{font-size:13px;color:var(--muted);line-height:1.7}
a{color:var(--blue)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.funnel .row{grid-template-columns:96px 1fr auto}}
@media(max-width:420px){.kpi .v{font-size:23px}.card{padding:14px}.hb{grid-template-columns:minmax(70px,34%) 1fr auto}}
</style>
</head>
<body>

<div class="loginwrap" id="login">
<form class="login" id="lform" autocomplete="on">
<h1>모아 관리자</h1>
<p>관리자 계정으로 로그인하세요. 계정은 Supabase 대시보드에서 만든 것을 씁니다.</p>
<label for="em">이메일</label><input id="em" name="email" type="email" autocomplete="username" required>
<label for="pw">비밀번호</label><input id="pw" name="password" type="password" autocomplete="current-password" required>
<button class="btn" type="submit" id="lbtn">로그인</button>
<p class="err" id="lerr" role="alert"></p>
</form>
</div>

<div id="app" hidden>
<header class="top"><div class="wrap"><b>모아 관리자</b><span class="who" id="who"></span><span class="sp"></span><button class="btn ghost sm" id="refresh">새로고침</button><button class="btn ghost sm" id="logout">로그아웃</button></div></header>
<nav><div class="wrap" id="nav" role="tablist">
<button role="tab" data-v="overview" aria-selected="true">개요</button>
<button role="tab" data-v="visits" aria-selected="false">방문 통계</button>
<button role="tab" data-v="students" aria-selected="false">학생 분포</button>
<button role="tab" data-v="notices" aria-selected="false">공고</button>
<button role="tab" data-v="feedback" aria-selected="false">의견<span class="badge" id="fbbadge" hidden></span></button>
<button role="tab" data-v="system" aria-selected="false">시스템</button>
</div></nav>
<main class="wrap">
<div class="bar"><h2 id="vtitle">개요</h2><span class="sp"></span><span class="muted" id="loaded"></span>
<label class="muted" for="days">기간</label><select id="days"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option></select></div>
<div id="msg" class="err" role="alert"></div>
<section id="v-overview"></section>
<section id="v-visits" hidden></section>
<section id="v-students" hidden></section>
<section id="v-notices" hidden></section>
<section id="v-feedback" hidden></section>
<section id="v-system" hidden></section>
</main>
</div>

<script>
const SB='https://ykpobrafcugzsjusuhny.supabase.co',KEY='sb_publishable_5QCXyy75eYyc_DzNGcx9Og_hsqACKN5';
const SHEET_URL='https://docs.google.com/spreadsheets/d/1dRob98i31VTSJfGOzasqhAUHY26jyB5Tv2OrOj2ZrqE';
const DASH_URL='https://supabase.com/dashboard/project/ykpobrafcugzsjusuhny';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
const todayKST=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const fmtTime=t=>{const s=new Date(t).toLocaleString('sv-SE',{timeZone:'Asia/Seoul'});return `${+s.slice(5,7)}월 ${+s.slice(8,10)}일 ${s.slice(11,16)}`};
const fmtDur=s=>s==null?'-':s<60?`${s}초`:`${Math.floor(s/60)}분 ${s%60}초`;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'-';
const L={device:{mobile:'휴대폰',tablet:'태블릿',desktop:'컴퓨터','?':'알 수 없음'},
 tabs:{mine:'내게 맞는 공고',all:'전체 공고',feedback:'의견 보내기',detail:'공고 상세'},
 kind:{'wrong-info':'정보가 틀렸어요',missing:'빠진 공고',idea:'기능 제안',bug:'오류',praise:'칭찬',other:'기타'},
 src:{direct:'직접 입력·링크 없음',everytime:'에브리타임'}};
const gradeLabel=k=>k==='5'?'5학년 이상':k+'학년';

let S=null,D={stats:null,fb:[],notices:[],meta:[]},view='overview',fbFilter='all',loadedAt=null;

/* ---------- auth + api ---------- */
function setSession(j,email){S={access_token:j.access_token,refresh_token:j.refresh_token,email:(j.user&&j.user.email)||email||(S&&S.email)||'',exp:Date.now()+(j.expires_in||3600)*1000};try{sessionStorage.setItem('moa-admin',JSON.stringify(S))}catch{}}
async function authCall(path,body){
 const r=await fetch(`${SB}/auth/v1/${path}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(r.status===400?'이메일 또는 비밀번호가 맞지 않아요.':(j.error_description||j.msg||j.message||'로그인 요청 실패 ('+r.status+')'));
 return j
}
async function api(path,opt={}){
 if(!S)throw new Error('login');
 if(Date.now()>S.exp-60000){try{setSession(await authCall('token?grant_type=refresh_token',{refresh_token:S.refresh_token}))}catch{doLogout();throw new Error('login')}}
 const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401){doLogout();throw new Error('login')}
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('요청 실패 ('+r.status+')'))}
 const t=await r.text();return t?JSON.parse(t):null
}
function doLogout(){S=null;try{sessionStorage.removeItem('moa-admin')}catch{}$('app').hidden=true;$('login').hidden=false;$('pw').value=''}
async function enter(){
 const a=await api('/rest/v1/admin_emails?select=email');
 if(!a||!a.length){doLogout();throw new Error('이 계정에는 관리자 권한이 없어요.')}
 $('login').hidden=true;$('app').hidden=false;$('who').textContent=S.email;
 await loadAll()
}
$('lform').onsubmit=async e=>{
 e.preventDefault();const b=$('lbtn');b.disabled=true;$('lerr').textContent='';
 try{setSession(await authCall('token?grant_type=password',{email:$('em').value.trim(),password:$('pw').value}),$('em').value.trim());await enter()}
 catch(err){if(err.message!=='login')$('lerr').textContent=err.message;$('pw').value=''}
 finally{b.disabled=false}
};
$('logout').onclick=doLogout;
$('refresh').onclick=()=>loadAll();
$('days').onchange=()=>loadAll();

/* ---------- loading ---------- */
async function loadAll(){
 $('msg').textContent='';$('loaded').textContent='불러오는 중…';
 try{
  const days=+$('days').value;
  const [stats,fb,notices,meta]=await Promise.all([
   api('/rest/v1/rpc/admin_stats',{method:'POST',body:JSON.stringify({p_days:days})}),
   api('/rest/v1/feedback?select=*&order=created_at.desc&limit=500'),
   api('/rest/v1/notices?select=title,end_date,posted_on,subcategory,org,url,source_id&order=end_date.asc.nullslast&limit=1000'),
   api('/rest/v1/site_meta?select=*')]);
  D={stats,fb,notices,meta};loadedAt=new Date();renderAll()
 }catch(err){if(err.message!=='login'){$('msg').textContent='불러오지 못했어요: '+err.message;$('loaded').textContent=''}}
}

/* ---------- small renderers ---------- */
function hbars(items,label,fmt){
 if(!items||!items.length)return '<div class="empty">아직 데이터가 없어요.</div>';
 const max=Math.max(...items.map(x=>x.n),1);
 return items.map(x=>`<div class="hb"><span class="k">${esc(label?label(x.k):x.k)}</span><div class="bar2"><i style="width:${Math.max(3,x.n/max*100)}%"></i></div><b>${fmt?fmt(x.n):x.n}</b></div>`).join('')
}
function dailyChart(rows,days){
 const map=Object.fromEntries((rows||[]).map(r=>[r.d,r])),t=new Date(todayKST()+'T00:00:00Z'),list=[];
 for(let i=days-1;i>=0;i--){const d=new Date(t-i*864e5).toISOString().slice(0,10),r=map[d]||{};list.push({d,v:r.visits||0,u:r.visitors||0})}
 const max=Math.max(4,...list.map(x=>x.v)),W=640,H=210,pl=32,pb=24,pt=8,ph=H-pb-pt,bw=(W-pl)/list.length,step=Math.ceil(list.length/8);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 방문 수 막대 그래프">`;
 [0,max/2,max].forEach(v=>{const y=pt+ph-ph*v/max;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`});
 list.forEach((x,i)=>{
  const x0=pl+i*bw+bw*.14,w=bw*.72,h1=ph*x.v/max,h2=ph*x.u/max;
  s+=`<g><title>${x.d} · 방문 ${x.v} · 방문자 ${x.u}</title><rect class="b1" x="${x0}" y="${pt+ph-h1}" width="${w}" height="${h1}" rx="2"/><rect class="b2" x="${x0+w*.22}" y="${pt+ph-h2}" width="${w*.56}" height="${h2}" rx="2"/></g>`;
  if(i%step===0)s+=`<text x="${x0+w/2}" y="${H-6}" text-anchor="middle">${x.d.slice(5).replace('-','/')}</text>`
 });
 return s+'</svg><div class="legend"><span><i style="background:#9fbdea"></i>방문(접속 횟수)</span><span><i style="background:#124eaa"></i>방문자(브라우저)</span></div>'
}
function hourChart(rows){
 const m=Object.fromEntries((rows||[]).map(r=>[r.h,r.n])),max=Math.max(1,...Object.values(m)),W=640,H=120,bw=W/24;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="시간대별 방문 막대 그래프">`;
 for(let h=0;h<24;h++){const n=m[h]||0,hh=(H-24)*n/max;s+=`<g><title>${h}시 · ${n}회</title><rect class="b2" x="${h*bw+3}" y="${H-18-hh}" width="${bw-6}" height="${hh}" rx="2"/></g>`;if(h%3===0)s+=`<text x="${h*bw+bw/2}" y="${H-4}" text-anchor="middle">${h}시</text>`}
 return s+'</svg>'
}
const kpi=(v,l,s,cls)=>`<div class="card kpi ${cls||''}"><div class="v">${v}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

/* ---------- views ---------- */
function rOverview(){
 const st=D.stats,t=st.totals,f=st.funnel,fb=st.feedback;
 const empty=t.visits===0?'<div class="card" style="margin-bottom:14px"><b>아직 방문 기록이 없어요.</b><div class="note">공개 사이트에 접속하면 기록이 쌓여요. 관리자 본인의 접속도 집계되니, 제외하려면 공개 사이트 맨 아래 "통계 집계 끄기"를 누르세요.</div></div>':'';
 const soon=D.notices.filter(n=>n.end_date&&n.end_date>=todayKST()&&n.end_date<=new Date(Date.now()+3*864e5).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'})).length;
 const noEnd=D.notices.filter(n=>!n.end_date).length;
 $('v-overview').innerHTML=empty+`<div class="grid kpis">
 ${kpi(st.today,'오늘 방문','한국 시간 기준')}
 ${kpi(t.visits,'기간 내 방문',`방문자 ${t.visitors}명(브라우저 기준)`)}
 ${kpi(fmtDur(t.avg_s),'평균 머문 시간',t.median_s!=null?`중앙값 ${fmtDur(t.median_s)} · ${t.timed}건 기준`:'측정된 방문 없음')}
 ${kpi(fb.new,'새 의견',`전체 ${fb.total}건`,fb.new>0?'alert':'')}
 </div>
 <div class="grid two" style="margin-top:14px">
 <div class="card"><h3>일별 방문</h3>${dailyChart(st.daily,+$('days').value)}</div>
 <div class="card funnel"><h3>방문 → 행동</h3>
  ${[['방문',f.visits],['맞춤 검색',f.searched],['공고 열람',f.opened],['의견 탭 방문',f.feedback_tab]].map(([k,n])=>`<div class="row"><span>${k}</span><div class="bar2"><i style="width:${f.visits?Math.max(2,n/f.visits*100):0}%"></i></div><b>${n} <span class="muted">${pct(n,f.visits)}</span></b></div>`).join('')}
  <div class="note" style="margin-top:10px">재방문 브라우저 ${st.returning}개 (기간 내 2번 이상 접속)</div></div>
 </div>
 <div class="grid two" style="margin-top:14px">
 <div class="card"><h3>공고 현황</h3><div class="note">사이트에 올라와 있는 공고 <b>${D.notices.length}건</b><br>3일 안에 마감 <b>${soon}건</b> · 마감일 없음 <b>${noEnd}건</b> (시트 N열을 채워야 자동 정리됨)</div></div>
 <div class="card"><h3>마지막 동기화</h3>${syncText()}</div>
 </div>`
}
function syncText(){const m=(D.meta||[]).find(x=>x.key==='last_sync');return m?`<div class="note">${fmtTime(m.updated_at)} · 공고 ${esc(m.value)}건 반영<br>구글 시트 → Supabase, 매시 10분 자동</div>`:'<div class="note">기록 없음</div>'}
function rVisits(){
 const st=D.stats,t=st.totals;
 $('v-visits').innerHTML=`<div class="grid kpis">
 ${kpi(t.visits,'방문')}${kpi(t.visitors,'방문자(브라우저)')}${kpi(fmtDur(t.avg_s),'평균 머문 시간')}${kpi(fmtDur(t.median_s),'머문 시간 중앙값')}</div>
 <div class="card" style="margin-top:14px"><h3>일별 방문</h3>${dailyChart(st.daily,+$('days').value)}</div>
 <div class="card" style="margin-top:14px"><h3>시간대별 방문 (한국 시간)</h3>${hourChart(st.hourly)}</div>
 <div class="grid two" style="margin-top:14px">
 <div class="card"><h3>기기</h3>${hbars(st.device,k=>L.device[k]||k)}</div>
 <div class="card"><h3>유입 경로</h3>${hbars(st.source,k=>L.src[k]||k)}<div class="note" style="margin-top:8px">홍보 링크 끝에 <span class="mono">?src=everytime</span>처럼 붙이면 어디서 왔는지 구분돼요.</div></div>
 <div class="card"><h3>많이 본 화면</h3>${hbars(st.tabs,k=>L.tabs[k]||k)}</div>
 <div class="card"><h3>안내</h3><div class="note">방문 = 한 번 접속해 있는 동안(탭을 닫으면 끝). 방문자 = 브라우저 기준이라 같은 사람이 폰과 컴퓨터로 들어오면 2명으로 잡혀요. 머문 시간은 화면을 보고 있던 시간만 센 값이고, 광고 차단기나 '추적 안 함'을 쓰는 사람은 빠져요.</div></div>
 </div>`
}
function rStudents(){
 const st=D.stats,n=(st.course||[]).reduce((a,x)=>a+x.n,0);
 $('v-students').innerHTML=`<div class="note" style="margin-bottom:12px">"내게 맞는 공고"에서 조건을 선택해 검색한 방문자 수예요. 한 사람이 여러 조건으로 검색하면 각각 셉니다. 검색 방문자 ${st.funnel.searched>0?'(방문 '+st.funnel.searched+'건)':''}</div>
 <div class="grid two">
 <div class="card"><h3>과정</h3>${hbars(st.course)}</div>
 <div class="card"><h3>학년 (학부)</h3>${hbars(st.grade,gradeLabel)}</div>
 <div class="card"><h3>단과대학</h3>${hbars(st.college)}</div>
 <div class="card"><h3>학과·전공 (상위 30)</h3>${hbars(st.dept)}</div>
 </div>`
}
function dday(e){if(!e)return '<span class="pill">마감일 없음</span>';const d=Math.round((new Date(e)-new Date(todayKST()))/864e5);return d<0?'<span class="pill">마감 지남</span>':`<span class="pill ${d<=3?'soon':''}">${d===0?'오늘':'D-'+d} · ${esc(e.slice(5).replace('-','/'))}</span>`}
function rNotices(){
 const views=Object.fromEntries((D.stats.notices||[]).map(x=>[x.title,x]));
 const rows=D.notices.map(n=>({...n,v:(views[n.title]||{}).n||0}));
 $('v-notices').innerHTML=`<div class="grid two">
 <div class="card"><h3>많이 본 공고 (상위 30)</h3>${D.stats.notices.length?`<div class="tw"><table><thead><tr><th>공고</th><th class="n">열람</th><th class="n">사람</th></tr></thead><tbody>${D.stats.notices.map(x=>`<tr><td>${esc(x.title)}</td><td class="n">${x.n}</td><td class="n">${x.viewers}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">아직 열람 기록이 없어요.</div>'}</div>
 <div class="card"><h3>마감 임박 순</h3><div class="note">원본은 구글 시트예요. 고치려면 <a href="${SHEET_URL}" target="_blank" rel="noopener noreferrer">시트 열기</a> (수정은 매시 10분에 반영)</div></div></div>
 <div class="card" style="margin-top:14px"><h3>현재 올라온 공고 ${rows.length}건</h3><div class="tw"><table><thead><tr><th>공고</th><th>분류</th><th>마감</th><th class="n">열람</th></tr></thead><tbody>
 ${rows.map(n=>`<tr><td>${safeUrl(n.url)?`<a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>`:esc(n.title)}<div class="muted">${esc(n.org||'')}</div></td><td>${esc(n.subcategory||'')}</td><td>${dday(n.end_date)}</td><td class="n">${n.v}</td></tr>`).join('')}
 </tbody></table></div></div>`
}
function rFeedback(){
 const fb=D.fb,nNew=fb.filter(x=>x.status==='new').length;
 const b=$('fbbadge');b.hidden=!nNew;b.textContent=nNew;
 const chips=[['all','전체 '+fb.length],['new','새 의견 '+nNew],['done','처리됨 '+(fb.length-nNew)],...Object.keys(L.kind).map(k=>[k,L.kind[k]+' '+fb.filter(x=>x.kind===k).length])];
 const list=fb.filter(x=>fbFilter==='all'||(fbFilter==='new'||fbFilter==='done'?x.status===fbFilter:x.kind===fbFilter));
 $('v-feedback').innerHTML=`<div class="chips" id="fchips">${chips.map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${fbFilter===k}">${esc(t)}</button>`).join('')}</div>
 <div class="fbs">${list.length?list.map(x=>`<article class="card fb" data-id="${esc(x.id)}">
  <div class="meta"><span class="pill ${x.status}">${x.status==='new'?'새 의견':'처리됨'}</span><span class="pill">${esc(L.kind[x.kind]||x.kind)}</span><span>${esc(fmtTime(x.created_at))}</span><span>${esc(L.device[x.device]||x.device||'')}</span></div>
  <div class="msg">${esc(x.message)}</div>${x.notice_title?`<div class="rel">관련 공고: ${esc(x.notice_title)}</div>`:''}
  <div class="act"><button class="btn sm ${x.status==='new'?'':'ghost'}" data-a="toggle">${x.status==='new'?'처리 완료로 표시':'새 의견으로 되돌리기'}</button><button class="btn sm danger" data-a="del">삭제</button></div></article>`).join(''):'<div class="card empty">해당하는 의견이 없어요.</div>'}</div>`
}
function rSystem(){
 const m=Object.fromEntries((D.meta||[]).map(x=>[x.key,x]));
 $('v-system').innerHTML=`<div class="grid two">
 <div class="card"><h3>공고 동기화</h3>${syncText()}<div style="margin-top:12px"><button class="btn sm" id="syncbtn">지금 동기화</button> <span class="muted" id="syncout"></span></div><div class="note" style="margin-top:8px">1분 안에 다시 누르면 건너뛰어요. 시트에서 막 고쳤을 때 바로 반영하려고 쓰세요.</div></div>
 <div class="card"><h3>바로가기</h3><div class="note">
 <a href="${SHEET_URL}" target="_blank" rel="noopener noreferrer">구글 시트 (공고 원본)</a><br>
 <a href="${DASH_URL}/editor" target="_blank" rel="noopener noreferrer">Supabase 테이블</a><br>
 <a href="${DASH_URL}/functions" target="_blank" rel="noopener noreferrer">Supabase 함수·동기화 로그</a><br>
 <a href="../" target="_blank" rel="noopener noreferrer">공개 사이트</a></div></div>
 <div class="card"><h3>자동 실행</h3><div class="note">· 매일 18:00 (내 PC) 새 공고 수집 → 만료 공고 정리<br>· 매시 10분 시트 → 사이트 동기화<br>· 수집 로그: PC의 <span class="mono">collector/state/logs</span>, 시트 <b>자동화기록</b> 탭</div></div>
 <div class="card"><h3>데이터 보관</h3><div class="note">이용 기록은 이름·IP 없이 임의 코드로만 쌓여요. 오래된 기록을 지우려면 Supabase에서 <span class="mono">events</span> 테이블을 정리하세요.</div></div>
 </div>`
}
function renderAll(){
 rOverview();rVisits();rStudents();rNotices();rFeedback();rSystem();
 $('loaded').textContent=loadedAt?fmtTime(loadedAt)+' 기준':''
}

/* ---------- events ---------- */
const TITLES={overview:'개요',visits:'방문 통계',students:'학생 분포',notices:'공고',feedback:'의견',system:'시스템'};
function setView(v){
 view=v;$('vtitle').textContent=TITLES[v];
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 Object.keys(TITLES).forEach(k=>$('v-'+k).hidden=k!==v);
 $('days').parentElement&&($('days').hidden=v==='feedback'||v==='system');
 document.querySelector('label[for=days]').hidden=$('days').hidden
}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};
$('v-feedback').onclick=async e=>{
 const c=e.target.closest('.chip');if(c){fbFilter=c.dataset.f;rFeedback();return}
 const btn=e.target.closest('button[data-a]');if(!btn)return;
 const id=btn.closest('.fb').dataset.id,x=D.fb.find(f=>f.id===id);if(!x)return;
 if(btn.dataset.a==='del'){
  if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='정말 삭제할까요? 한 번 더 누르면 삭제';setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent='삭제'}},4000);return}
  try{await api(`/rest/v1/feedback?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});D.fb=D.fb.filter(f=>f.id!==id);rFeedback();rOverview()}catch(err){$('msg').textContent='삭제하지 못했어요: '+err.message}
 }else{
  const ns=x.status==='new'?'done':'new';
  try{await api(`/rest/v1/feedback?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:ns})});x.status=ns;D.stats.feedback.new=D.fb.filter(f=>f.status==='new').length;rFeedback();rOverview()}catch(err){$('msg').textContent='바꾸지 못했어요: '+err.message}
 }
};
$('v-system').onclick=async e=>{
 if(e.target.id!=='syncbtn')return;const b=e.target,o=$('syncout');b.disabled=true;o.textContent='동기화 중…';
 try{const r=await fetch(`${SB}/functions/v1/sync-notices`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:'{}'});const j=await r.json().catch(()=>({}));
  o.textContent=j.ok?(j.skipped?'방금 동기화돼서 건너뛰었어요':`완료 · 공고 ${j.rows}건`):('실패: '+(j.error||r.status));if(j.ok&&!j.skipped)loadAll()}
 catch{o.textContent='연결하지 못했어요'}finally{b.disabled=false}
};

/* ---------- boot ---------- */
(async()=>{
 setView('overview');
 try{const s=JSON.parse(sessionStorage.getItem('moa-admin')||'null');if(s&&s.refresh_token){S=s;await enter()}}
 catch(err){if(err.message!=='login'&&err.message)$('lerr').textContent=err.message}
})();
</script>
</body>
</html>
